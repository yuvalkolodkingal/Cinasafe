[package]
name = "cinasafe-player"
description = "libmpv wrapper and cinasafe:// stream bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Link libmpv (and FFmpeg, libplacebo, libass, dav1d) into the binary instead of
# loading it at run time. Release packages use it; see build.rs.
static-mpv = []

[dependencies]
cinasafe-core = { path = "../cinasafe-core" }
libloading = "0.8.9"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
zeroize = "1"
