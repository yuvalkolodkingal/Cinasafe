[package]
name = "cinasafe-core"
description = "Cinasafe vault, crypto and blob format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
bip39 = { version = "3.0.0", features = ["zeroize"] }
chardetng = "1.0.0"
encoding_rs = "0.8.35"
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.12.4"
hunch = { version = "2.0.2", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
memsec = "0.7.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json", "charset", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
strsim = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing", "macros"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[features]
# Plaintext key file instead of a password-protected vault. Milestone 0 only;
# never enable in the app.
spike-insecure-keyfile = []

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
