[package]
name = "cinasafe-app"
description = "Cinasafe desktop app: Tauri shell, IPC commands and the embedded player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "cinasafe-app"
path = "src/main.rs"

[dependencies]
cinasafe-core = { path = "../../crates/cinasafe-core" }
cinasafe-player = { path = "../../crates/cinasafe-player" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3.27.0"
zeroize = "1.9.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"
libc = "0.2"
webkit2gtk = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }
