[package]
name = "tauri-embed-spike"
description = "Milestone 0: embed libmpv video under the Tauri web UI"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cinasafe-core = { path = "../../crates/cinasafe-core", features = ["spike-insecure-keyfile"] }
cinasafe-player = { path = "../../crates/cinasafe-player" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
libloading = "0.8"
webkit2gtk = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
