name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev python3-cryptography python3-argon2 \
            libmpv2 ffmpeg
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The app embeds the built UI, so it's built before any cargo step.
      - name: UI tests and build
        working-directory: app/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The player tests play real media through libmpv (the distribution's here).
      - run: cargo test --workspace
        env:
          CINASAFE_REQUIRE_LIBMPV: '1'
      - name: Check blob test vectors with an independent implementation
        run: python3 -I crates/cinasafe-core/tests/vectors/verify_vectors.py
      - name: THIRD_PARTY_LICENSES.md is up to date (and no GPL-only dependency crept in)
        run: python3 scripts/third-party-licenses.py --check

  e2e:
    name: UI screenshots in Hebrew and Arabic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies and Chromium
        working-directory: app/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compare every screen with its baseline
        working-directory: app/ui
        env:
          CI: '1'
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: |
            app/ui/e2e-results/
            app/ui/e2e-report/
          retention-days: 7

  disk-trace:
    name: Disk trace (no plaintext on the host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libmpv2 ffmpeg fatrace xvfb xdotool imagemagick libgl1-mesa-dri
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the UI, the CLI and the app (release, UI embedded)
        run: |
          npm ci --prefix app/ui
          npm run build --prefix app/ui
          cargo build --release -p cinasafe-cli
          cargo build --release -p cinasafe-app --features tauri/custom-protocol
      - name: The checker finds a planted leak
        run: DISK_TRACE_SELF_TEST=1 PLAY_SECONDS=3 scripts/disk-trace.sh
      - name: Full session under fatrace (create, import, play, app unlock, resume, lock, quit)
        run: scripts/disk-trace.sh --app

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: UI build
        working-directory: app/ui
        run: |
          npm ci
          npm run build
      - run: cargo test --workspace
