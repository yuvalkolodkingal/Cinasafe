name: Build packages

# Builds the Windows .exe (portable zip and installer) and the Linux .deb and
# .rpm on every code push, and publishes them as a GitHub release for v* tags.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Tauri app to package. Switch to app/src-tauri when the real shell lands.
  APP_DIR: spike/tauri-embed
  TAURI_CLI_VERSION: 2.12.4

jobs:
  linux:
    name: Linux .deb and .rpm (x86_64)
    # The oldest supported Ubuntu, so the binary's glibc requirement stays low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev rpm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build .deb and .rpm
        working-directory: ${{ env.APP_DIR }}
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles deb,rpm
      - name: Build the cinasafe CLI
        run: cargo build --release -p cinasafe-cli
      - name: Show package metadata
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          rpm -qp --info --requires target/release/bundle/rpm/*.rpm
      - name: Collect artifacts
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/
          tar -czf dist/cinasafe-cli-linux-x86_64.tar.gz -C target/release cinasafe
          (cd dist && sha256sum * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinasafe-linux-x86_64
          path: dist/
          retention-days: 14

  windows:
    name: Windows .exe (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch libmpv-2.dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin these repository variables before shipping a release; see third_party/mpv/README.md.
          LIBMPV_RELEASE: ${{ vars.LIBMPV_RELEASE }}
          LIBMPV_SHA256: ${{ vars.LIBMPV_SHA256 }}
        run: |
          $dir = "third_party/mpv/windows-x86_64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $tag = @()
          if ($env:LIBMPV_RELEASE) { $tag = @($env:LIBMPV_RELEASE) }
          gh release download @tag --repo zhongfly/mpv-winbuild --pattern 'mpv-dev-x86_64-2*.7z' --dir mpv-download
          if ($LASTEXITCODE -ne 0) { throw "could not download libmpv" }
          $archive = Get-ChildItem mpv-download/*.7z | Select-Object -First 1
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "libmpv archive: $($archive.Name) sha256 $hash"
          if ($env:LIBMPV_SHA256) {
            if ($hash -ne $env:LIBMPV_SHA256.ToLower()) { throw "libmpv archive SHA-256 does not match LIBMPV_SHA256" }
          } else {
            Write-Host "::warning::libmpv is not pinned. Set repository variables LIBMPV_RELEASE and LIBMPV_SHA256 (this run used $($archive.Name), $hash)."
          }
          7z e $archive.FullName "-o$dir" libmpv-2.dll -r -y
          if (-not (Test-Path "$dir/libmpv-2.dll")) { throw "libmpv-2.dll not found in $($archive.Name)" }
          "$($archive.Name) $hash" | Out-File -Encoding utf8 "$dir/SOURCE.txt"
      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        # The extra config adds libmpv-2.dll to the installer. It lives in its own file because
        # tauri-build requires listed resources to exist, which plain `cargo test` can't provide.
        run: npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --bundles nsis --config tauri.windows-bundle.conf.json
      - name: Build the cinasafe CLI
        run: cargo build --release -p cinasafe-cli
      - name: Collect artifacts
        shell: pwsh
        run: |
          $portable = "dist/Cinasafe-Windows-x86_64"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target/release/cinasafe-app.exe "$portable/Cinasafe-Windows.exe"
          Copy-Item third_party/mpv/windows-x86_64/libmpv-2.dll $portable
          Copy-Item third_party/mpv/windows-x86_64/SOURCE.txt "$portable/libmpv-SOURCE.txt"
          Copy-Item target/release/cinasafe.exe $portable
          Compress-Archive -Path "$portable/*" -DestinationPath dist/Cinasafe-Windows-x86_64-portable.zip
          Remove-Item -Recurse $portable
          Copy-Item target/release/bundle/nsis/*.exe dist/
          # Hash first, then write: piping straight into Out-File would list the sums file itself.
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File -Encoding utf8 dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinasafe-windows-x86_64
          path: dist/
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cinasafe $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
