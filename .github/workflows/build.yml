name: Build packages

# Builds our LGPL libmpv (third_party/mpv), then the app for each platform:
# Linux .deb, .rpm and AppImage; Windows installer and portable zip. Tags
# v* publish a pre-release with a ready-to-copy stick kit, SHA-256 sums and,
# when the MINISIGN_SECRET_KEY secret exists, a minisign signature. Running the
# workflow by hand on main with a release_tag does the same, creating the tag
# on the commit it built.
#
# ARM builds need ARM runners, which GitHub gives free only to public
# repositories; they run when the repository variable ENABLE_ARM_RUNNERS is
# "true" (see docs/RELEASING.md).

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a pre-release with this tag (e.g. v0.1.0; main only). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: read

# A newer push waits for a running build instead of cancelling it: these
# builds (libmpv especially) are slow to restart. Older queued runs are dropped.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_DIR: app/src-tauri
  TAURI_CLI_VERSION: 2.12.4

jobs:
  libmpv-linux:
    name: libmpv LGPL (linux-${{ matrix.arch }})
    strategy:
      matrix:
        include: ${{ fromJSON(vars.ENABLE_ARM_RUNNERS == 'true' && '[{"arch":"x86_64","runner":"ubuntu-22.04"},{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-22.04"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            third_party/mpv/linux-${{ matrix.arch }}
            third_party/mpv/libmpv-sources-linux.tar.gz
          key: libmpv-linux-${{ matrix.arch }}-${{ hashFiles('third_party/mpv/build-linux.sh') }}
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm ninja-build pkg-config python3-jinja2 python3-pip patchelf \
            libass-dev libva-dev libdrm-dev libegl-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev liblcms2-dev
          pip3 install --user meson==1.12.1
      - name: Build libmpv (LGPL)
        if: steps.cache.outputs.cache-hit != 'true'
        run: PATH="$HOME/.local/bin:$PATH" third_party/mpv/build-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-linux-${{ matrix.arch }}
          path: |
            third_party/mpv/linux-${{ matrix.arch }}/
            third_party/mpv/libmpv-sources-linux.tar.gz
          retention-days: 14

  linux:
    name: Linux .deb, .rpm and AppImage (${{ matrix.arch }})
    needs: libmpv-linux
    strategy:
      matrix:
        include: ${{ fromJSON(vars.ENABLE_ARM_RUNNERS == 'true' && '[{"arch":"x86_64","runner":"ubuntu-22.04"},{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]' || '[{"arch":"x86_64","runner":"ubuntu-22.04"}]') }}
    # The oldest supported Ubuntu, so the binaries' glibc requirement stays low.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          # libmpv's own dependencies too (the same set its build used), for the load test and linuxdeploy.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev rpm libfuse2 file \
            libass-dev libva-dev libdrm-dev libegl-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libpulse-dev liblcms2-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-linux-${{ matrix.arch }}
          path: third_party/mpv
      - name: Check the bundled libmpv loads and accepts every mandatory option
        env:
          CINASAFE_REQUIRE_LIBMPV: '1'
          CINASAFE_LIBMPV_DIR: ${{ github.workspace }}/third_party/mpv/linux-${{ matrix.arch }}
        run: cargo test -p cinasafe-player --test load -- --nocapture
      - name: Install UI dependencies
        run: npm ci --prefix app/ui
      - name: Put libmpv into the AppImage
        # The .deb and .rpm depend on the distribution's libmpv instead.
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          lib = pathlib.Path("third_party/mpv/linux-${{ matrix.arch }}").resolve()
          files = {f"/usr/lib/{p.name}": str(p) for p in sorted(lib.iterdir()) if ".so" in p.name}
          conf = {"bundle": {"linux": {"appimage": {"bundleMediaFramework": False, "files": files}}}}
          pathlib.Path("${{ env.APP_DIR }}/tauri.appimage.conf.json").write_text(json.dumps(conf, indent=2))
          print(json.dumps(conf, indent=2))
          EOF
      - name: Build .deb, .rpm and AppImage
        working-directory: ${{ env.APP_DIR }}
        env:
          # linuxdeploy runs extracted (no FUSE needed) and must not strip newer ELF sections.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles deb,rpm,appimage --config tauri.appimage.conf.json
      - name: Build the cinasafe CLI
        run: cargo build --release -p cinasafe-cli
      - name: Check the AppImage carries libmpv and its dependencies
        run: |
          appimage=$(realpath target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)"
          "$appimage" --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libmpv.so.2
          missing=$(LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/lib/libmpv.so.2 | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          du -sh squashfs-root
      - name: Show package metadata
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          rpm -qp --info --requires target/release/bundle/rpm/*.rpm
      - name: Collect artifacts
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/
          cp target/release/bundle/appimage/*.AppImage "dist/Cinasafe-Linux-${{ matrix.arch }}.AppImage"
          tar -czf "dist/cinasafe-cli-linux-${{ matrix.arch }}.tar.gz" -C target/release cinasafe
          cp third_party/mpv/libmpv-sources-linux.tar.gz "dist/libmpv-sources-linux-${{ matrix.arch }}.tar.gz"
          (cd dist && sha256sum * > "SHA256SUMS-linux-${{ matrix.arch }}.txt" && cat "SHA256SUMS-linux-${{ matrix.arch }}.txt")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinasafe-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  libmpv-windows:
    name: libmpv LGPL (windows-${{ matrix.arch }})
    strategy:
      matrix:
        include: ${{ fromJSON(vars.ENABLE_ARM_RUNNERS == 'true' && '[{"arch":"x86_64","runner":"windows-latest","msystem":"UCRT64","extra":"nasm:p"},{"arch":"arm64","runner":"windows-11-arm","msystem":"CLANGARM64","extra":""}]' || '[{"arch":"x86_64","runner":"windows-latest","msystem":"UCRT64","extra":"nasm:p"}]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            third_party/mpv/windows-${{ matrix.arch }}
            third_party/mpv/libmpv-sources-windows-${{ matrix.arch }}.tar.gz
          key: libmpv-windows-${{ matrix.arch }}-${{ hashFiles('third_party/mpv/build-windows.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make diffutils
          pacboy: >-
            toolchain:p meson:p ninja:p pkgconf:p libass:p libplacebo:p dav1d:p lcms2:p
            shaderc:p spirv-cross:p ntldd:p ${{ matrix.extra }}
      - name: Build libmpv (LGPL)
        if: steps.cache.outputs.cache-hit != 'true'
        run: third_party/mpv/build-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv-windows-${{ matrix.arch }}
          path: |
            third_party/mpv/windows-${{ matrix.arch }}/
            third_party/mpv/libmpv-sources-windows-${{ matrix.arch }}.tar.gz
          retention-days: 14

  windows:
    name: Windows .exe (${{ matrix.arch }})
    needs: libmpv-windows
    strategy:
      matrix:
        include: ${{ fromJSON(vars.ENABLE_ARM_RUNNERS == 'true' && '[{"arch":"x86_64","runner":"windows-latest"},{"arch":"arm64","runner":"windows-11-arm"}]' || '[{"arch":"x86_64","runner":"windows-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-windows-${{ matrix.arch }}
          path: third_party/mpv
      - name: Check the bundled libmpv loads and accepts every mandatory option
        env:
          CINASAFE_REQUIRE_LIBMPV: '1'
          CINASAFE_LIBMPV_DIR: ${{ github.workspace }}\third_party\mpv\windows-${{ matrix.arch }}
        run: cargo test -p cinasafe-player --test load -- --nocapture
      - name: Install UI dependencies
        run: npm ci --prefix app/ui
      - name: Put libmpv into the installer
        # A separate config file: tauri-build requires listed resources to exist,
        # which plain `cargo test` can't provide.
        shell: pwsh
        run: |
          $conf = @{ bundle = @{ resources = @{ "../../third_party/mpv/windows-${{ matrix.arch }}/" = "mpv/" } } }
          $conf | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 "$env:APP_DIR/tauri.windows-bundle.conf.json"
          Get-Content "$env:APP_DIR/tauri.windows-bundle.conf.json"
      - name: Build installer
        working-directory: ${{ env.APP_DIR }}
        run: npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --bundles nsis --config tauri.windows-bundle.conf.json
      - name: Build the cinasafe CLI
        run: cargo build --release -p cinasafe-cli
      - name: Collect artifacts
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $portable = "dist/Cinasafe-Windows-$arch"
          New-Item -ItemType Directory -Force "$portable/mpv" | Out-Null
          Copy-Item target/release/cinasafe-app.exe "$portable/Cinasafe-Windows.exe"
          Copy-Item target/release/cinasafe.exe $portable
          Copy-Item -Recurse "third_party/mpv/windows-$arch/*" "$portable/mpv/"
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/Cinasafe-Windows-$arch-portable.zip"
          Remove-Item -Recurse $portable
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Copy-Item "third_party/mpv/libmpv-sources-windows-$arch.tar.gz" dist/
          # Hash first, then write: piping straight into Out-File would list the sums file itself.
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File -Encoding utf8 "dist/SHA256SUMS-windows-$arch.txt"
          Get-Content "dist/SHA256SUMS-windows-$arch.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinasafe-windows-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  stick-kit:
    name: Stick kit
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the version being released
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match the workspace version $version"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cinasafe-*
          path: dist
          merge-multiple: true
      - name: Assemble what goes on a stick (brief 4.1)
        # Copy the folder's contents to an exFAT stick and run the app from it; the
        # create-vault wizard does the rest. Windows' libmpv lives in .cinasafe/runtime.
        run: |
          kit=Cinasafe-stick
          mkdir -p "$kit"
          cp app/src-tauri/stick/README.txt app/src-tauri/stick/run-linux.sh "$kit/"
          chmod +x "$kit/run-linux.sh"
          for f in dist/Cinasafe-Linux-*.AppImage; do cp "$f" "$kit/"; done
          for zip in dist/Cinasafe-Windows-*-portable.zip; do
            arch=$(basename "$zip" | sed 's/Cinasafe-Windows-\(.*\)-portable.zip/\1/')
            tmp=$(mktemp -d)
            unzip -q "$zip" -d "$tmp"
            exe=Cinasafe-Windows.exe
            [ "$arch" = arm64 ] && exe=Cinasafe-Windows-arm64.exe
            cp "$tmp/Cinasafe-Windows.exe" "$kit/$exe"
            mkdir -p "$kit/.cinasafe/runtime/windows-$arch"
            cp -r "$tmp/mpv/." "$kit/.cinasafe/runtime/windows-$arch/"
          done
          cp THIRD_PARTY_LICENSES.md LICENSE "$kit/.cinasafe/runtime/"
          (cd "$kit" && zip -qr -9 ../Cinasafe-stick-kit.zip . && ls -la . .cinasafe/runtime)
          mkdir out && mv Cinasafe-stick-kit.zip out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinasafe-stick-kit
          path: out/
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main')
    needs: [linux, windows, stick-kit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the version being released
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match the workspace version $version"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cinasafe-*
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cp THIRD_PARTY_LICENSES.md dist/
          rm -f dist/SHA256SUMS-*.txt
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            sudo apt-get install -y minisign >/dev/null
            umask 077
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
            # The key is created without a password (minisign -G -W); see docs/RELEASING.md.
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS.txt -t "Cinasafe $TAG"
            rm -f "$RUNNER_TEMP/minisign.key"
          else
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS.txt is not signed."
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a tag push the tag exists; when run by hand, this creates it on the built commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cinasafe $TAG" \
            --generate-notes \
            --prerelease
